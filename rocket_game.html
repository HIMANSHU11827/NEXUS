<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Rocket Landing Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        .game-wrapper {
            background: linear-gradient(180deg, #0a0a2e 0%, #1a1a3e 100%);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 50px rgba(0, 100, 255, 0.2);
        }
        canvas {
            display: block;
            border-radius: 12px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .game-ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 5px;
            color: #fff;
        }
        .game-ui .stats span {
            margin-right: 20px;
            color: #8af;
        }
        .game-ui .controls {
            display: flex;
            gap: 8px;
        }
        .key-hint {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #aaa;
        }
        .key-hint kbd {
            background: rgba(255,255,255,0.12);
            padding: 2px 6px;
            border-radius: 3px;
            color: #fff;
            font-weight: bold;
        }
        .fuel-bar {
            width: 120px;
            height: 8px;
            background: #222;
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
        }
        .fuel-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f44, #fa0);
            border-radius: 4px;
            transition: width 0.1s;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-ui">
        <div class="stats">
            <span>🛸 <strong id="score">0</strong></span>
            <span>⛽ <span class="fuel-bar"><span class="fuel-fill" id="fuelFill" style="width:100%"></span></span> <span id="fuelText">100</span>%</span>
            <span>📊 <strong id="level">1</strong></span>
        </div>
        <div class="controls">
            <span class="key-hint"><kbd>←</kbd> <kbd>→</kbd> Move</span>
            <span class="key-hint"><kbd>↑</kbd> Thrust</span>
            <span class="key-hint"><kbd>R</kbd> Restart</span>
        </div>
    </div>
    <canvas id="game" width="700" height="600"></canvas>
</div>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = 700, H = 600;

    // Stars background
    const stars = Array.from({length: 120}, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.5,
        a: Math.random()
    }));

    // Rocket
    const rocket = {
        x: W / 2,
        y: 60,
        vx: 0,
        vy: 0,
        w: 18,
        h: 30,
        angle: 0,
        thrust: false,
        fuel: 100,
        landed: false,
        crashed: false,
        particles: []
    };

    // Landing pad
    const pad = {
        x: W / 2 - 40,
        y: H - 30,
        w: 80,
        h: 8
    };

    // Physics
    const GRAVITY = 0.04;
    const THRUST = 0.12;
    const MAX_FUEL = 100;
    const FUEL_BURN = 0.25;

    let score = 0;
    let level = 1;
    let gameOver = false;
    let keys = {};

    function resetGame() {
        rocket.x = W / 2;
        rocket.y = 60;
        rocket.vx = 0;
        rocket.vy = 0;
        rocket.angle = 0;
        rocket.thrust = false;
        rocket.fuel = MAX_FUEL;
        rocket.landed = false;
        rocket.crashed = false;
        rocket.particles = [];
        gameOver = false;
        score = 0;
        level = 1;
        document.getElementById('score').textContent = '0';
        document.getElementById('level').textContent = '1';
        pad.x = Math.random() * (W - 100) + 20;
    }

    function nextLevel() {
        level++;
        rocket.x = W / 2;
        rocket.y = 60;
        rocket.vx = 0;
        rocket.vy = 0;
        rocket.angle = 0;
        rocket.thrust = false;
        rocket.fuel = MAX_FUEL;
        rocket.landed = false;
        rocket.crashed = false;
        rocket.particles = [];
        gameOver = false;
        pad.x = Math.random() * (W - 100) + 20;
        document.getElementById('level').textContent = level;
    }

    // Particles
    function spawnExhaust(x, y, vx, vy) {
        for (let i = 0; i < 3; i++) {
            rocket.particles.push({
                x: x + (Math.random() - 0.5) * 6,
                y: y + 10,
                vx: (Math.random() - 0.5) * 0.5 - vx * 0.1,
                vy: Math.random() * 1.5 + 1,
                life: 1,
                size: Math.random() * 4 + 2,
                color: Math.random() > 0.3 ? '#f84' : '#fa0'
            });
        }
    }

    function spawnExplosion(x, y) {
        for (let i = 0; i < 40; i++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = Math.random() * 4 + 1;
            rocket.particles.push({
                x: x + (Math.random() - 0.5) * 10,
                y: y + (Math.random() - 0.5) * 10,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd,
                life: 1,
                size: Math.random() * 5 + 2,
                color: ['#f44','#f84','#fa0','#fff'][Math.floor(Math.random()*4)]
            });
        }
    }

    function update() {
        if (gameOver || rocket.landed) return;

        // Input
        let left = keys['ArrowLeft'] || keys['a'];
        let right = keys['ArrowRight'] || keys['d'];
        let up = keys['ArrowUp'] || keys['w'];

        // Thrust
        rocket.thrust = up && rocket.fuel > 0;

        if (up && rocket.fuel > 0) {
            rocket.vy -= THRUST;
            rocket.fuel = Math.max(0, rocket.fuel - FUEL_BURN);
            spawnExhaust(rocket.x, rocket.y, rocket.vx, rocket.vy);
        }

        // Horizontal movement
        if (left) rocket.vx -= 0.03;
        if (right) rocket.vx += 0.03;

        // Gravity
        rocket.vy += GRAVITY;

        // Air drag
        rocket.vx *= 0.995;
        rocket.vy *= 0.998;

        // Angle follows velocity
        let targetAngle = Math.atan2(rocket.vy, rocket.vx || 0.001) + Math.PI / 2;
        if (Math.abs(rocket.vx) < 0.1 && Math.abs(rocket.vy) < 0.1) targetAngle = 0;
        rocket.angle += (targetAngle - rocket.angle) * 0.05;

        // Move
        rocket.x += rocket.vx;
        rocket.y += rocket.vy;

        // Walls
        if (rocket.x < 10) { rocket.x = 10; rocket.vx *= -0.3; }
        if (rocket.x > W - 10) { rocket.x = W - 10; rocket.vx *= -0.3; }

        // Top
        if (rocket.y < 10) { rocket.y = 10; rocket.vy = Math.abs(rocket.vy) * 0.3; }

        // Landing check
        const rocketBottom = rocket.y + rocket.h / 2;
        const rocketLeft = rocket.x - rocket.w / 2 + 5;
        const rocketRight = rocket.x + rocket.w / 2 - 5;

        if (rocketBottom >= pad.y && rocketBottom <= pad.y + 12 &&
            rocket.x > pad.x && rocket.x < pad.x + pad.w) {

            const landingSpeed = Math.abs(rocket.vy);
            const sidewaysSpeed = Math.abs(rocket.vx);
            const angleOk = Math.abs(rocket.angle) < 0.3;

            if (landingSpeed < 2.5 && sidewaysSpeed < 0.8 && angleOk) {
                // SUCCESSFUL LANDING!
                rocket.landed = true;
                rocket.y = pad.y - rocket.h / 2;
                rocket.vy = 0;
                rocket.vx = 0;
                rocket.angle = 0;
                const bonus = Math.floor((2.5 - landingSpeed) * 20 + (0.8 - sidewaysSpeed) * 30 + Math.round(rocket.fuel));
                score += 50 + Math.max(0, bonus);
                document.getElementById('score').textContent = score;
                spawnExplosion(rocket.x, rocket.y);
                setTimeout(nextLevel, 1500);
            } else {
                // CRASH!
                rocket.crashed = true;
                gameOver = true;
                spawnExplosion(rocket.x, rocket.y);
                setTimeout(resetGame, 2000);
            }
        }

        // Bottom (missed pad = crash)
        if (rocket.y > H - 15 && !rocket.landed) {
            if (rocket.vy > 1.5) {
                rocket.crashed = true;
                gameOver = true;
                spawnExplosion(rocket.x, rocket.y);
                setTimeout(resetGame, 2000);
            } else {
                rocket.y = H - 15;
                rocket.vy = 0;
            }
        }

        // Update particles
        for (let i = rocket.particles.length - 1; i >= 0; i--) {
            const p = rocket.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.02 - Math.random() * 0.005;
            p.vy += 0.02;
            if (p.life <= 0) {
                rocket.particles.splice(i, 1);
            }
        }

        // Fuel display
        const fuelPct = Math.round(rocket.fuel);
        document.getElementById('fuelText').textContent = fuelPct;
        document.getElementById('fuelFill').style.width = fuelPct + '%';
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);

        // Stars
        stars.forEach(s => {
            ctx.globalAlpha = 0.4 + Math.sin(Date.now() * 0.001 + s.a * 10) * 0.3;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Background planet glow
        const grd = ctx.createRadialGradient(600, 500, 20, 600, 500, 300);
        grd.addColorStop(0, 'rgba(60, 40, 120, 0.15)');
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, W, H);

        // Mountains
        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath();
        ctx.moveTo(0, H - 30);
        for (let i = 0; i <= W; i += 30) {
            ctx.lineTo(i, H - 30 - Math.sin(i * 0.02) * 30 - Math.sin(i * 0.05) * 15);
        }
        ctx.lineTo(W, H);
        ctx.lineTo(0, H);
        ctx.fill();

        // Landing pad
        ctx.shadowColor = '#0ff';
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#4af';
        ctx.fillRect(pad.x, pad.y, pad.w, pad.h);
        // Pad stripes
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 4; i++) {
            ctx.fillRect(pad.x + 10 + i * 18, pad.y - 2, 10, 4);
        }
        ctx.shadowBlur = 0;

        // Pad glow
        ctx.fillStyle = 'rgba(68, 170, 255, 0.1)';
        ctx.beginPath();
        ctx.ellipse(pad.x + pad.w/2, pad.y + 4, pad.w/2, 8, 0, 0, Math.PI*2);
        ctx.fill();

        // Particles (behind rocket)
        rocket.particles.forEach(p => {
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;

        // Rocket body
        ctx.save();
        ctx.translate(rocket.x, rocket.y);
        ctx.rotate(rocket.angle);

        const r = rocket;
        const nose = -r.h / 2;
        const base = r.h / 2;

        // Engine flame
        if (rocket.thrust && !rocket.landed) {
            ctx.shadowColor = '#f84';
            ctx.shadowBlur = 25;
            const flameLen = 12 + Math.random() * 10;
            ctx.fillStyle = '#fa0';
            ctx.beginPath();
            ctx.moveTo(-5, base);
            ctx.lineTo(0, base + flameLen);
            ctx.lineTo(5, base);
            ctx.fill();
            ctx.fillStyle = '#f44';
            ctx.beginPath();
            ctx.moveTo(-3, base);
            ctx.lineTo(0, base + flameLen * 0.6);
            ctx.lineTo(3, base);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Main body
        ctx.shadowColor = 'rgba(100, 200, 255, 0.3)';
        ctx.shadowBlur = 20;
        const bodyGrd = ctx.createLinearGradient(-r.w/2, 0, r.w/2, 0);
        bodyGrd.addColorStop(0, '#556');
        bodyGrd.addColorStop(0.3, '#8899bb');
        bodyGrd.addColorStop(0.5, '#aabbdd');
        bodyGrd.addColorStop(0.7, '#8899bb');
        bodyGrd.addColorStop(1, '#556');
        ctx.fillStyle = bodyGrd;

        // Nose cone
        ctx.beginPath();
        ctx.moveTo(0, nose - 4);
        ctx.lineTo(-r.w/2, nose + 5);
        ctx.lineTo(-r.w/2, base);
        ctx.lineTo(r.w/2, base);
        ctx.lineTo(r.w/2, nose + 5);
        ctx.closePath();
        ctx.fill();

        // Nose tip
        ctx.fillStyle = '#cc3344';
        ctx.beginPath();
        ctx.moveTo(0, nose - 6);
        ctx.lineTo(-6, nose + 2);
        ctx.lineTo(6, nose + 2);
        ctx.closePath();
        ctx.fill();

        // Windows
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#4af';
        ctx.beginPath();
        ctx.arc(0, -3, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#8cf';
        ctx.beginPath();
        ctx.arc(0, -3, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-1.5, -4, 1.5, 0, Math.PI * 2);
        ctx.fill();

        // Fins
        ctx.fillStyle = '#d44';
        ctx.beginPath();
        ctx.moveTo(-r.w/2, base - 2);
        ctx.lineTo(-r.w/2 - 8, base + 6);
        ctx.lineTo(-r.w/2, base + 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(r.w/2, base - 2);
        ctx.lineTo(r.w/2 + 8, base + 6);
        ctx.lineTo(r.w/2, base + 2);
        ctx.fill();

        // Center fin
        ctx.fillStyle = '#b33';
        ctx.beginPath();
        ctx.moveTo(0, base - 4);
        ctx.lineTo(-3, base + 8);
        ctx.lineTo(3, base + 8);
        ctx.closePath();
        ctx.fill();

        ctx.restore();

        // Status messages
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = '18px "Courier New", monospace';
        ctx.textAlign = 'center';

        if (rocket.landed) {
            ctx.fillStyle = '#4f4';
            ctx.font = '28px "Courier New", monospace';
            ctx.shadowColor = '#0f0';
            ctx.shadowBlur = 20;
            ctx.fillText('✅ LANDED!', W/2, 50);
            ctx.font = '16px "Courier New", monospace';
            ctx.fillStyle = '#8f8';
            ctx.fillText('Next level incoming...', W/2, 80);
        }

        if (rocket.crashed) {
            ctx.fillStyle = '#f44';
            ctx.font = '28px "Courier New", monospace';
            ctx.shadowColor = '#f00';
            ctx.shadowBlur = 20;
            ctx.fillText('💥 CRASHED!', W/2, 50);
            ctx.font = '16px "Courier New", monospace';
            ctx.fillStyle = '#f88';
            ctx.fillText('Too fast or too sideways...', W/2, 80);
        }

        // Landing zone indicator
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(68, 170, 255, 0.3)';
        ctx.font = '12px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('▼ LANDING ZONE ▼', pad.x + pad.w/2, pad.y - 8);

        // Speed indicator
        const speed = Math.sqrt(rocket.vx * rocket.vx + rocket.vy * rocket.vy);
        ctx.fillStyle = speed > 2.5 ? '#f44' : '#4f4';
        ctx.textAlign = 'right';
        ctx.font = '13px "Courier New", monospace';
        ctx.fillText(`Speed: ${speed.toFixed(1)}`, W - 15, 25);
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Controls
    document.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        if (e.key === 'r' || e.key === 'R') {
            resetGame();
        }
    });
    document.addEventListener('keyup', (e) => {
        keys[e.key] = false;
    });

    // Prevent scrolling
    window.addEventListener('keydown', (e) => {
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
            e.preventDefault();
        }
    });

    gameLoop();
</script>
</body>
</html>
