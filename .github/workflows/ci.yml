name: NEXUS CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q nexus server shell orchestrators tools rag knowledge utils providers gui/api.py
      - name: Unit tests
        run: python -m pytest -q

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json
      - name: Install GUI deps
        working-directory: gui
        run: npm ci
      - name: Build GUI
        working-directory: gui
        run: npm run build
