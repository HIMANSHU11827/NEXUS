name: NEXUS CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src/nexus apps extensions models memory knowledge evolution hive gateways queues sandbox security reliability observability evaluation maintenance configure scripts
      - name: Release gate
        run: python scripts/release_gate.py
      - name: Unit tests
        run: python -m pytest -q

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install GUI deps
        working-directory: apps/web
        run: npm ci
      - name: Build GUI
        working-directory: apps/web
        run: npm run build
