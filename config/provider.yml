providers:
  deepseek:
    model: deepseek-chat
    endpoint: https://api.deepseek.com/chat/completions
    temperature: 0.7
    max_tokens: 8192
    api_key: ${DEEPSEEK_API_KEY}
  openrouter:
    model: nvidia/nemotron-3-ultra-550b-a55b:free
    endpoint: https://openrouter.ai/api/v1/chat/completions
    temperature: 0.7
    max_tokens: 8192
    api_key: ${OPENROUTER_API_KEY}
  lm_studio:
    model: qwen3.5-0.8b-coder-calude-full
    endpoint: http://127.0.0.1:1234/v1/chat/completions
    temperature: 0.2
    max_tokens: 4096
  grok:
    model: grok-4.3
    endpoint: https://api.x.ai/v1/chat/completions
    temperature: 0.7
    max_tokens: 8192
  ollama:
    model: llama3
    endpoint: http://127.0.0.1:11434/api/chat
    temperature: 0.7
    max_tokens: 4096
version: 1.1.0
default_provider: deepseek
fallback_chain:
- deepseek
- openrouter
documented_blocker:
  codex: ChatGPT OAuth token must be sent to chatgpt.com/backend-api/codex with Cloudflare
    originator + ChatGPT-Account-ID headers (see .research/hermes-agent); no plain-Bearer
    OpenAI-compatible endpoint.
  claude: Token is a Claude.ai/Platform session token; Anthropic Messages API (api.anthropic.com/v1/messages)
    is not OpenAI-compatible and requires x-api-key/anthropic-version.
  github-copilot: api.individual.githubcopilot.com/chat/completions is OpenAI-compatible
    and Bearer-authenticated, but requires Copilot-specific headers (Openai-Intent,
    Copilot-Integration-Id, Editor-Version, ...) that UniversalProvider never sends.
    OAuth id is 'github-copilot' but the factory mapping is 'github_copilot'.
  minimax: Device-flow client_id is the placeholder 'YOUR_MINIMAX_CLIENT_ID' unless
    NEXUS_MINIMAX_CLIENT_ID is set; no validated OpenAI-compatible Bearer endpoint.
  chutes: No clearly documented OpenAI-compatible endpoint for the chutes.ai OAuth
    token.
  qwen: DashScope compatible-mode endpoint is known, but an Aliyun consumer OAuth
    token is NOT validated as a DashScope API-key Bearer (needs a sk-* DashScope key).
  gemini: OAuth token is a Google access token with a placeholder client_id; Gemini
    native API requires x-goog-api-key, not a Bearer token.
reliability:
  retry:
    max_attempts: 3
    base_delay: 0.5
    max_delay: 30.0
    multiplier: 2.0
    jitter: 0.25
    respect_retry_after: true
    max_retry_after: 120.0
  circuit_breaker:
    failure_threshold: 3
    cooldown: 30.0
    half_open_max_calls: 1
    success_threshold: 1
model_capabilities:
