[project]
name = "nexus-ai"
version = "2.1.0"
description = "NEXUS AI - The Operating System of Intelligence"
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "cryptography>=42.0",
    "dataclasses-json>=0.6",
    "discord.py>=2.3",
    "fastapi>=0.115",
    "httpx>=0.28",
    "itsdangerous>=2.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pytelegrambotapi>=4.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "rich>=13.0",
    "requests>=2.31",
    "uvicorn>=0.30",
    "slack-sdk>=3.43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
ml = [
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2",
]
browser = [
    "playwright>=1.50",
]
vision = [
    "mediapipe>=0.10",
    "opencv-python>=4.8",
    "numpy>=1.26",
]
voice = [
    "accelerate>=0.26",
    "keyboard>=0.13.5",
    "numpy>=1.26",
    "pywhispercpp>=1.5.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "torch>=2.2",
    "transformers>=4.35",
    "kittentts @ https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl",
]
gateway = [
    "matrix-nio>=0.25",
    "websockets>=12.0",
]

[project.scripts]
nexus = "nexus:boot"
nexus-tui = "nexus:boot"
nexus-shell = "nexus:boot"
nexus-gui = "nexus:boot"
nexus-server = "nexus:boot"
nexus-api = "nexus:boot"
nexus-gateway = "nexus:boot"
nexus-setup = "nexus:boot"
nexus-configure = "nexus:boot"
nexus-config = "nexus:boot"
nexus-settings = "nexus:boot"
nexus-quick = "nexus:boot"
nexus-reset = "nexus:boot"
nexus-export = "nexus:boot"
nexus-export-full = "nexus:boot"
nexus-import = "nexus:boot"
nexus-import-full = "nexus:boot"
nexus-version = "nexus:boot"
nexus-help = "nexus:boot"
point = "nexus:boot"
nexus-fix = "nexus:boot"
nexus-mcp = "mcp.server:main"
nexus-voice = "voice.voice_chat:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sandbox*", "authentication*", "context*", "evolution*", "hardware*", "intelligence*", "neural*", "reasoning*", "safety*", "security*", "tasks*", "telemetry*", "voice*", "prompts*", "orchestrators*", "utils*", "tools*", "rag*", "integrations*", "knowledge*", "mcp*", "gateway*", "configure*", "hive*", "indexer*", "kernel*", "permissions*", "router*", "skills*", "server*", "nexus*"]
exclude = [
    "tests*",
    "gui*",
    "models*",
    "skill*",
    "temp_gemini_cli*",
    "workspace*",
    "scratch*",
    "training_data*",
    "data*",
    "tools.docker*",
    "tools.elite*",
    "gui.scratch*",
]

[tool.pyright]
include = ["."]
extraPaths = ["."]
typeCheckingMode = "basic"
reportMissingImports = false

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402", "E701", "F401", "I001", "E702", "E741", "F841", "E722", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path: local packages (queue/, tools/, ...) shadow stdlib
# names, so tests only resolved under `python -m pytest`, which injects cwd.
# Without this the bare `pytest` entrypoint fails collection on 9 modules.
pythonpath = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"
