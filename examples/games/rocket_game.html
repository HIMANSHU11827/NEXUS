<!DOCTYPE html><html><head><title>Rocket Blast</title><style>body{margin:0;background:#0a0a2e;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh}canvas{border:2px solid #fff}</style></head><body><canvas id='game' width='600' height='400'></canvas><script>const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const rocket={x:100,y:200,width:30,height:50,vx:0,vy:0,speed:4};const keys={};const obstacles=[];let score=0;let gameOver=false;let frame=0;document.addEventListener('keydown',e=>{keys[e.key]=true});document.addEventListener('keyup',e=>{keys[e.key]=false});function spawnObstacle(){const type=Math.random()>0.5?'asteroid':'meteor';const size=20+Math.random()*30;obstacles.push({x:canvas.width,y:Math.random()*(canvas.height-size),width:size,height:size,type:type,speed:2+Math.random()*2})}function update(){if(gameOver)return;if(keys['ArrowUp']||keys['w'])rocket.vy=-rocket.speed;if(keys['ArrowDown']||keys['s'])rocket.vy=rocket.speed;if(keys['ArrowLeft']||keys['a'])rocket.vx=-rocket.speed;if(keys['ArrowRight']||keys['d'])rocket.vx=rocket.speed;rocket.x+=rocket.vx;rocket.y+=rocket.vy;rocket.vx*=0.9;rocket.vy*=0.9;if(rocket.x<0)rocket.x=0;if(rocket.y<0)rocket.y=0;if(rocket.x+rocket.width>canvas.width)rocket.x=canvas.width-rocket.width;if(rocket.y+rocket.height>canvas.height)rocket.y=canvas.height-rocket.height;if(frame%60===0)spawnObstacle();for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.x-=o.speed;if(o.x+o.width<0){obstacles.splice(i,1);score++;continue}if(rocket.x<o.x+o.width&&rocket.x+rocket.width>o.x&&rocket.y<o.y+o.height&&rocket.y+rocket.height>o.y){gameOver=true;break}}frame++}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);// Draw stars for(let i=0;i<50;i++){ctx.fillStyle='white';ctx.beginPath();ctx.arc(Math.random()*canvas.width,Math.random()*canvas.height,1+Math.random()*2,0,Math.PI*2);ctx.fill()}// Draw rocket ctx.fillStyle='#ff4444';ctx.beginPath();ctx.moveTo(rocket.x+rocket.width/2,rocket.y);ctx.lineTo(rocket.x+rocket.width,rocket.y+rocket.height);ctx.lineTo(rocket.x,rocket.y+rocket.height);ctx.closePath();ctx.fill();ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.moveTo(rocket.x+rocket.width/2,rocket.y+20);ctx.lineTo(rocket.x+5,rocket.y+rocket.height-5);ctx.lineTo(rocket.x+rocket.width-5,rocket.y+rocket.height-5);ctx.closePath();ctx.fill();// Flame ctx.fillStyle='#ff6600';ctx.beginPath();ctx.moveTo(rocket.x+rocket.width/2-8,rocket.y+rocket.height);ctx.lineTo(rocket.x+rocket.width/2,rocket.y+rocket.height+15+Math.random()*10);ctx.lineTo(rocket.x+rocket.width/2+8,rocket.y+rocket.height);ctx.closePath();ctx.fill();// Obstacles for(const o of obstacles){ctx.fillStyle=o.type==='asteroid'?'#888':'#ffaa44';ctx.beginPath();ctx.arc(o.x+o.width/2,o.y+o.height/2,o.width/2,0,Math.PI*2);ctx.fill()}// Score ctx.fillStyle='white';ctx.font='20px Arial';ctx.fillText('Score: '+score,10,30);if(gameOver){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='red';ctx.font='40px Arial';ctx.fillText('GAME OVER',canvas.width/2-120,canvas.height/2-20);ctx.fillStyle='white';ctx.font='20px Arial';ctx.fillText('Press Space to restart',canvas.width/2-100,canvas.height/2+20)}}function gameLoop(){update();draw();requestAnimationFrame(gameLoop)}document.addEventListener('keydown',e=>{if(e.key===' '&&gameOver){gameOver=false;rocket.x=100;rocket.y=200;obstacles.length=0;score=0;frame=0}});gameLoop();</script></body></html>
